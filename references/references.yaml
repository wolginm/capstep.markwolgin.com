  - id: IA-WAYBACK-URL
    author: Wikipedia contributors
    title: "Help:Using the Wayback Machine — Wayback Machine URL formats (flags id_, if_, im_)"
    publisher: Wikipedia, The Free Encyclopedia
    url: https://en.wikipedia.org/wiki/Help:Using_the_Wayback_Machine
    accessed: 2026-10-25
    note: >-
      Documents the `id_` flag ("Identity - perform no alterations of the original resource,
      return it as it was archived") used for raw capture URLs (`/web/<ts>id_/<url>`), and the
      `if_` flag recommended for toolbar-free links to view pages. The Internet Archive's own FAQ
      once described `id_` but no longer does (Internet Archive Forums, "FAQ On 'id_' Wayback
      Toolbar Removal", https://archive.org/post/1008502/faq-on-id_-wayback-toolbar-removal),
      so this community-maintained page is the best available description.
