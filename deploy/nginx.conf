# Sample nginx server block for a self-hosted copy of the site.
#
# Copy the contents of web/dist/ to the `root` directory below, adjust server_name,
# and include this file from the `http` block (e.g. /etc/nginx/conf.d/capitol-steps.conf).
# Add TLS as usual for your setup (e.g. certbot). See docs/DEPLOY.md.
#
# No rewrite rules are needed: the site uses hash-based routes (/#/song/401k), so
# the server only ever receives requests for real files [REACT-ROUTER-HASHROUTER].
# No audio is served from here; the player streams from web.archive.org.
#
# Caching [MDN-CACHE-CONTROL]:
#   /assets/  file names contain a content hash, so they can be cached for a year.
#   index.html and /data/  no-cache: browsers revalidate, so a new build or catalog
#                          shows up immediately.
#
# Note: an `add_header` inside a `location` replaces any set at the server level, so
# each location sets its own Cache-Control [NGINX-HEADERS].
#
# References:
#   [NGINX-CORE] server, listen, root, index, location, try_files,
#       https://nginx.org/en/docs/http/ngx_http_core_module.html
#   [NGINX-HEADERS] add_header, https://nginx.org/en/docs/http/ngx_http_headers_module.html
#   [NGINX-GZIP] gzip, gzip_types, https://nginx.org/en/docs/http/ngx_http_gzip_module.html
#   [MDN-CACHE-CONTROL] https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control
#   [VITE-STATIC-DEPLOY] https://vite.dev/guide/static-deploy

server {
    listen 80;
    listen [::]:80;
    server_name capsteps.example.org;

    root /var/www/capitol-steps;
    index index.html;

    # text/html is always compressed; add the site's other text formats.
    gzip on;
    gzip_types text/css application/javascript application/json text/markdown image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /data/ {
        try_files $uri =404;
        # The stock mime.types has no entry for .md (the AI-usage log).
        types {
            application/json json;
            text/markdown    md;
        }
        add_header Cache-Control "no-cache" always;
    }
}
