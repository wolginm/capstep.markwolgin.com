# CI and GitHub Pages deployment.
#
# Every push and pull request runs all the checks: citation lints, the bibliography
# check, Python and web tests, the type check, the build and the browser smoke test.
# Only pushes to main (or a manual run on main) then deploy web/dist/ to Pages.
# CI never runs ingestion and never contacts the Internet Archive; it builds from the
# committed data/catalog.json, and the smoke test blocks archive requests.
#
# One-time setup: Settings -> Pages -> Source = "GitHub Actions" (see docs/DEPLOY.md).
# The custom domain (capstep.markwolgin.com) is a Pages setting plus a DNS record. With a
# custom workflow like this one, no CNAME file is needed in the artifact
# [GH-PAGES-CUSTOM-DOMAIN].
#
# References:
#   [GH-ACTIONS-WORKFLOW-SYNTAX] jobs, needs, if, permissions, concurrency,
#       https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
#   [GH-ACTIONS-EVENTS] push, pull_request, workflow_dispatch,
#       https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
#   [GH-ACTIONS-SECURE-USE] least-privilege GITHUB_TOKEN permissions,
#       https://docs.github.com/en/actions/reference/security/secure-use
#   [GH-PAGES-CUSTOM-WORKFLOW] build + deploy jobs, github-pages environment,
#       https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
#   [GH-PAGES-CUSTOM-DOMAIN] custom domain without a CNAME file,
#       https://docs.github.com/en/pages/configuring-a-custom-domain-for-your-github-pages-site/managing-a-custom-domain-for-your-github-pages-site
#   [GHA-CHECKOUT] https://github.com/actions/checkout
#   [GHA-SETUP-NODE] node-version-file, npm cache, https://github.com/actions/setup-node
#   [GHA-SETUP-UV] https://github.com/astral-sh/setup-uv
#   [UV-GITHUB-ACTIONS] https://docs.astral.sh/uv/guides/integration/github/
#   [NPM-CI] https://docs.npmjs.com/cli/v11/commands/npm-ci
#   [PLAYWRIGHT-CI] https://playwright.dev/docs/ci
#   [GHA-UPLOAD-PAGES-ARTIFACT] https://github.com/actions/upload-pages-artifact
#   [GHA-DEPLOY-PAGES] https://github.com/actions/deploy-pages

name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch. A newer push cancels an older pull-request run, but never
  # interrupts a deployment that is already under way.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Python citation lint
        run: uv run --no-project --with pyyaml python tools/lint_citations.py

      - name: Bibliography is up to date and cites only registered IDs
        run: uv run --no-project --with pyyaml python tools/build_bibliography.py --check

      - name: Tool tests
        run: uv run --no-project --with pytest --with pyyaml pytest -q tools/tests

      - name: Ingest tests
        working-directory: ingest
        run: uv run --locked pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint (oxlint + TypeScript citation lint)
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Unit and component tests
        working-directory: web
        run: npm test

      - name: Install Chromium for the smoke test
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (builds the site, then serves it)
        working-directory: web
        run: npm run test:e2e

      - name: Build the site
        working-directory: web
        run: npm run build

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
