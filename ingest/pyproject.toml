# Project/dependency management: [UV-DOCS] https://docs.astral.sh/uv/
[project]
name = "capsteps-ingest"
version = "0.1.0"
description = "Wayback Machine CDX ingestion for the Capitol Steps preservation index"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capsteps_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
